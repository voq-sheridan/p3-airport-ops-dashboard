function toLocalDate(iso) {
  if (!iso) return null;
  const dt = new Date(iso);
  return Number.isNaN(dt.getTime()) ? null : dt;
}

function torontoDateKey(date) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Toronto",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);
  const year = parts.find((p) => p.type === "year")?.value;
  const month = parts.find((p) => p.type === "month")?.value;
  const day = parts.find((p) => p.type === "day")?.value;
  return `${year}-${month}-${day}`;
}

function torontoHour(date) {
  return Number(
    date.toLocaleString("en-CA", {
      timeZone: "America/Toronto",
      hour12: false,
      hour: "2-digit"
    })
  );
}

function parseDateKey(dateKey) {
  const [y, m, d] = dateKey.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d, 0, 0, 0));
}

function shiftDateKey(dateKey, offsetDays) {
  const dt = parseDateKey(dateKey);
  dt.setUTCDate(dt.getUTCDate() + offsetDays);
  const y = dt.getUTCFullYear();
  const m = String(dt.getUTCMonth() + 1).padStart(2, "0");
  const d = String(dt.getUTCDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function formatTimeEt(iso) {
  if (!iso) return "—";
  const dt = new Date(iso);
  if (Number.isNaN(dt.getTime())) return "—";
  return dt.toLocaleString("en-CA", {
    timeZone: "America/Toronto",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
}

function formatHourLabel(hour) {
  return `${String(hour).padStart(2, "0")}:00`;
}

function getDateLabel(dateObj) {
  return dateObj.toLocaleDateString("en-CA", {
    timeZone: "America/Toronto",
    month: "short",
    day: "numeric"
  });
}

function isWithinTimeRange(dateObj, selectedRange) {
  if (!selectedRange || selectedRange === "all") return true;
  const hour = torontoHour(dateObj);
  if (selectedRange === "00-06") return hour >= 0 && hour < 6;
  if (selectedRange === "06-12") return hour >= 6 && hour < 12;
  if (selectedRange === "12-18") return hour >= 12 && hour < 18;
  if (selectedRange === "18-24") return hour >= 18 && hour < 24;
  return true;
}

function filterFlightsByDateAndTime(flights, selectedDate, selectedRange) {
  return flights.filter((f) => {
    const dt = toLocalDate(f.scheduledTime);
    if (!dt) return false;

    if (selectedDate && selectedDate !== "all" && getDateLabel(dt) !== selectedDate) {
      return false;
    }

    return isWithinTimeRange(dt, selectedRange);
  });
}

function inferCountryFromIata(iata) {
  const code = (iata || "").toUpperCase();
  if (code === "YYZ") return "CA";
  if (/^Y[A-Z0-9]{2}$/.test(code)) return "CA";
  return null;
}

function getAirlineName(flight) {
  if (!flight) return "Unknown";
  if (typeof flight.airline === "string") return flight.airline;
  return flight.airline?.name || flight.flightNumber || "Unknown";
}

function normalizeFlightRecord(flight) {
  const departureIata =
    flight?.departure?.airport?.iata ||
    flight?.departureIata ||
    (flight?.type === "arrival" ? flight?.otherAirportCode : "YYZ") ||
    "";

  const arrivalIata =
    flight?.arrival?.airport?.iata ||
    flight?.arrivalIata ||
    (flight?.type === "departure" ? flight?.otherAirportCode : "YYZ") ||
    "";

  const depCountry =
    flight?.departure?.airport?.countryCode ||
    flight?.departureCountryCode ||
    inferCountryFromIata(departureIata);
  const arrCountry =
    flight?.arrival?.airport?.countryCode ||
    flight?.arrivalCountryCode ||
    inferCountryFromIata(arrivalIata);
  const airlineName = getAirlineName(flight);

  return {
    ...flight,
    airline: { name: airlineName },
    airlineName,
    departure: {
      airport: {
        iata: departureIata,
        countryCode: depCountry || null
      }
    },
    arrival: {
      airport: {
        iata: arrivalIata,
        countryCode: arrCountry || null
      }
    }
  };
}

function filterFlightsByType(flights, type) {
  const normalizeCountryCode = (code) => {
    if (!code || typeof code !== "string") return null;
    const normalized = code.trim().toUpperCase();
    return normalized || null;
  };

  if (type === "domestic") {
    return flights.filter((flight) => {
      const dep = normalizeCountryCode(flight.departure?.airport?.countryCode);
      const arr = normalizeCountryCode(flight.arrival?.airport?.countryCode);
      return dep && arr && dep === arr;
    });
  }

  if (type === "international") {
    return flights.filter((flight) => {
      const dep = normalizeCountryCode(flight.departure?.airport?.countryCode);
      const arr = normalizeCountryCode(flight.arrival?.airport?.countryCode);
      return dep && arr && dep !== arr;
    });
  }

  return flights;
}

function aggregateAirlines(flights) {
  const map = new Map();

  flights.forEach(flight => {
    const name = flight.airline?.name;
    if (!name) return;

    map.set(name, (map.get(name) || 0) + 1);
  });

  return Array.from(map.entries())
    .sort((a, b) => b[1] - a[1]);
}

function getDelayMinutes(flight) {
  const directDelay = [flight?.delayMinutes, flight?.delay, flight?.delayMin]
    .find((v) => Number.isFinite(Number(v)));
  if (Number.isFinite(Number(directDelay))) return Number(directDelay);

  const scheduled = toLocalDate(flight?.scheduledTime);
  const comparisonIso =
    flight?.revisedTime ||
    flight?.actualTime ||
    flight?.estimatedTime ||
    flight?.predictedTime ||
    flight?.departure?.revisedTime ||
    flight?.departure?.actualTime ||
    flight?.arrival?.revisedTime ||
    flight?.arrival?.actualTime;
  const comparison = toLocalDate(comparisonIso);

  if (!scheduled || !comparison) return 0;
  return Math.round((comparison.getTime() - scheduled.getTime()) / 60000);
}

function isYYZDeparture(f) {
  return (f.departureIata || "").toUpperCase() === "YYZ" || f.type === "departure";
}

function isYYZArrival(f) {
  return (f.arrivalIata || "").toUpperCase() === "YYZ" || f.type === "arrival";
}

function getHeatmapDateKeys(loadedDates) {
  const loaded = [loadedDates?.yesterday, loadedDates?.today, loadedDates?.tomorrow].filter(
    (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)
  );
  if (loaded.length === 3) return loaded;
  const todayKey = torontoDateKey(new Date());
  return [shiftDateKey(todayKey, -1), todayKey, shiftDateKey(todayKey, 1)];
}

function buildDirectionalHeatmapData(flights, dateKeys, mode) {
  const effectiveDateKeys = [...dateKeys];
  const byDateHour = new Map();

  flights.forEach((f) => {
    if (mode === "departures" && !isYYZDeparture(f)) return;
    if (mode === "arrivals" && !isYYZArrival(f)) return;

    const when = toLocalDate(f.scheduledTime);
    if (!when) return;

    const dateKey = torontoDateKey(when);
    if (!effectiveDateKeys.includes(dateKey)) return;

    const hour = torontoHour(when);
    if (hour < 0 || hour > 23) return;

    const mapKey = `${dateKey}|${hour}`;
    if (!byDateHour.has(mapKey)) {
      byDateHour.set(mapKey, {
        dateKey,
        hour,
        total: 0,
        airlines: new Set()
      });
    }

    const slot = byDateHour.get(mapKey);
    slot.total += 1;
    slot.airlines.add(getAirlineName(f));
  });

  const cells = [];
  effectiveDateKeys.forEach((dateKey) => {
    for (let hour = 0; hour < 24; hour++) {
      const slot = byDateHour.get(`${dateKey}|${hour}`);
      cells.push(slot ?? { dateKey, hour, total: 0, airlines: new Set() });
    }
  });

  const maxTotal = d3.max(cells, (d) => d.total) || 0;
  return { dateKeys: effectiveDateKeys, cells, maxTotal };
}

function buildHeatmapBands(peakMax) {
  const peak = Math.max(1, Number(peakMax) || 1);
  let q1 = Math.ceil(peak * 0.25);
  let q2 = Math.ceil(peak * 0.5);
  let q3 = Math.ceil(peak * 0.75);
  q1 = Math.max(1, q1);
  q2 = Math.max(q1 + 1, q2);
  q3 = Math.max(q2 + 1, q3);
  return {
    domain: [1, q1 + 1, q2 + 1, q3 + 1],
    lowMax: q1,
    moderateMin: q1 + 1,
    moderateMax: q2,
    busyMin: q2 + 1,
    busyMax: q3,
    peakMin: q3 + 1
  };
}

}

function createOperationalInsightsCarouselCard() {
  const card = document.createElement("div");
  card.className = "metric-card";

  const root = document.createElement("div");
  root.className = "insights-carousel";

  const titleEl = document.createElement("div");
  titleEl.className = "insights-title";
  titleEl.textContent = "Operational Insights";

  const bodyEl = document.createElement("div");
  bodyEl.className = "insights-body";

  const dots = document.createElement("div");
  dots.className = "insights-dots";

  const dotsWrap = document.createElement("div");
  dotsWrap.className = "insights-dots-wrap";
  dotsWrap.appendChild(dots);

  root.append(titleEl, bodyEl, dotsWrap);
  card.appendChild(root);

  const AUTO_ROTATE_MS = 30 * 1000;
  let insights = [];
  let currentInsightIndex = 0;
  let rotateTimer = null;
  let isHovering = false;

  function stopAutoRotate() {
    if (rotateTimer) {
      clearTimeout(rotateTimer);
      rotateTimer = null;
    }
  }

  function queueNextAutoRotate(delayMs = AUTO_ROTATE_MS) {
    stopAutoRotate();
    if (isHovering || insights.length <= 1) return;
    rotateTimer = setTimeout(() => {
      setInsight((currentInsightIndex + 1) % insights.length, true);
      queueNextAutoRotate(AUTO_ROTATE_MS);
    }, delayMs);
  }

  function renderDots() {
    dots.innerHTML = "";
    insights.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = `insights-dot${i === currentInsightIndex ? " active" : ""}`;
      dot.setAttribute("aria-label", `Go to insight ${i + 1}`);
      dot.textContent = "●";
      dot.addEventListener("click", () => {
        setInsight(i, true);
        queueNextAutoRotate(AUTO_ROTATE_MS);
      });
      dots.appendChild(dot);
    });
  }

  function renderInsight(insight) {
    if (!insight) {
      bodyEl.innerHTML = '<div class="insights-line">No operational insight available.</div>';
      return;
    }

    bodyEl.innerHTML = `
      <div class="insights-line">${insight.label}: <span class="insights-value ${insight.valueClass || ""}">${insight.value}</span></div>`;
  }

  function setInsight(nextIndex, withFade = true) {
    if (!insights.length) {
      renderInsight(null);
      renderDots();
      return;
    }

    currentInsightIndex = ((nextIndex % insights.length) + insights.length) % insights.length;

    if (!withFade) {
      renderInsight(insights[currentInsightIndex]);
      renderDots();
      return;
    }

    bodyEl.classList.add("fading");
    setTimeout(() => {
      renderInsight(insights[currentInsightIndex]);
      renderDots();
      bodyEl.classList.remove("fading");
    }, 140);
  }

  card.addEventListener("mouseenter", () => {
    isHovering = true;
    stopAutoRotate();
  });

  card.addEventListener("mouseleave", () => {
    isHovering = false;
    queueNextAutoRotate(1200);
  });

  return {
    card,
    setInsights(nextInsights) {
      insights = Array.isArray(nextInsights) ? nextInsights.slice(0, 6) : [];
      currentInsightIndex = 0;
      setInsight(currentInsightIndex, false);
      queueNextAutoRotate(AUTO_ROTATE_MS);
    },
    stop() {
      stopAutoRotate();
    }
  };
}

function getFlightsForCell(flights, mode, dateKey, hour) {
  return flights.filter((f) => {
    if (mode === "departures" && !isYYZDeparture(f)) return false;
    if (mode === "arrivals" && !isYYZArrival(f)) return false;
    const dt = toLocalDate(f.scheduledTime);
    if (!dt) return false;
    return torontoDateKey(dt) === dateKey && torontoHour(dt) === hour;
  });
}

function renderDetailPanel(event, datum, mode, filteredFlights) {
  selectedCell = { mode, dateKey: datum.dateKey, hour: datum.hour };
  const currentFlights = getFlightsForCell(filteredFlights, mode, datum.dateKey, datum.hour);
  const prevHour = datum.hour === 0 ? 23 : datum.hour - 1;
  const prevDateKey = datum.hour === 0 ? shiftDateKey(datum.dateKey, -1) : datum.dateKey;
  const previousFlights = getFlightsForCell(filteredFlights, mode, prevDateKey, prevHour);
  const delta = currentFlights.length - previousFlights.length;
  const arrow = delta >= 0 ? "↑" : "↓";
  const deltaText = `${delta >= 0 ? "+" : ""}${delta}`;

  const airlines = aggregateAirlines(currentFlights).slice(0, 8);
  const airlineGrid = airlines.length
    ? `<div class="airline-grid">${airlines
        .map(([name, count]) => `<div>${name} (${count})</div>`)
        .join("")}</div>`
    : '<div class="meta">No airlines in this slot.</div>';

  ui.detailPanel.innerHTML = `
    <button type="button" class="detail-panel-close" aria-label="Close details">✕</button>
    <div class="detail-time">${formatHourLabel(datum.hour)}</div>

    closeBtn.addEventListener("click", (e) => {

      ui.detailPanel.classList.add("hidden");
      renderForSelection();
    });

  const x = Math.min(Math.max(event.clientX - cardRect.left + 12, 12), cardRect.width - 290);
  const y = Math.min(Math.max(event.clientY - cardRect.top + 12, 12), cardRect.height - 220);

  ui.detailPanel.style.left = `${x}px`;
  ui.detailPanel.style.top = `${y}px`;

}

function drawDirectionalHeatmap(svg, container, heatmapData, mode, filteredFlights) {
  const { dateKeys, cells } = heatmapData;
  svg.selectAll("*").remove();

  const margin = { top: 28, right: 122, bottom: 14, left: 112 };
  const cols = 24;
  const gap = 3;

  const baseWidth = container.clientWidth || 1000;
  const usableWidth = Math.max(360, baseWidth - margin.left - margin.right);
  const cellSize = Math.max(16, Math.floor((usableWidth - gap * (cols - 1)) / cols));
  const gridWidth = cols * cellSize + (cols - 1) * gap;
  const rows = dateKeys.length;
  const gridHeight = rows * cellSize + (rows - 1) * gap;

  const width = margin.left + gridWidth + margin.right;
  const height = margin.top + gridHeight + margin.bottom;

  svg
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("preserveAspectRatio", "xMinYMin meet")
    .attr("width", "100%")
    .attr("height", height);

  const g = svg.append("g");
  const todayKey = torontoDateKey(new Date());
  const currentHour = torontoHour(new Date());
  const todayRowIndex = dateKeys.indexOf(todayKey);

  const rowIndexByKey = new Map(dateKeys.map((d, i) => [d, i]));
  const totalColumnGap = 20;
  const totalColumnWidth = Math.max(cellSize + 10, Math.round(cellSize * 1.25));
  const totalsByDate = new Map(
    dateKeys.map((dateKey) => [
      dateKey,
      d3.sum(cells.filter((c) => c.dateKey === dateKey), (c) => c.total)
    ])
  );
  const totalColX = margin.left + gridWidth + totalColumnGap;

  g.selectAll(".heatmap-hour-label")
    .data(d3.range(24))
    .join("text")
    .attr("class", "heatmap-axis-label heatmap-hour-label")
    .attr("x", (d) => margin.left + d * (cellSize + gap) + cellSize / 2)
    .attr("y", margin.top - 8)
    .attr("text-anchor", "middle")
    .text((d) => String(d).padStart(2, "0"));

  g.append("text")
    .attr("class", "heatmap-axis-label heatmap-total-label")
    .attr("x", totalColX + totalColumnWidth / 2)
    .attr("y", margin.top - 8)
    .attr("text-anchor", "middle")
    .style("font-weight", "700")
    .text("Total");

  g.selectAll(".heatmap-date-label")
    .data(dateKeys)
    .join("text")
    .attr("class", "heatmap-axis-label heatmap-date-label")
    .attr("x", margin.left - 10)
    .attr("y", (_, i) => margin.top + i * (cellSize + gap) + cellSize / 2 + 4)
    .attr("text-anchor", "end")
    .style("font-weight", (d) => (d === todayKey ? "700" : "400"))
    .text((d) =>
      parseDateKey(d).toLocaleDateString("en-CA", {
        timeZone: "UTC",
        weekday: "short",
        month: "short",
        day: "numeric"
      })
    );

  g.selectAll(".heatmap-cell")
    .data(cells)
    .join("rect")
    .attr("class", (d) => {
      const selected =
        selectedCell &&
        selectedCell.mode === mode &&
        selectedCell.dateKey === d.dateKey &&
        selectedCell.hour === d.hour;
      return `heatmap-cell${selected ? " heatmap-cell-selected" : ""}`;
    })
    .attr("x", (d) => margin.left + d.hour * (cellSize + gap))
    .attr("y", (d) => margin.top + rowIndexByKey.get(d.dateKey) * (cellSize + gap))
    .attr("width", cellSize)
    .attr("height", cellSize)
    .attr("rx", 4)
    .attr("ry", 4)
    .attr("fill", (d) => heatmapColor(d.total))
    .style("cursor", "pointer")
    .on("click", (event, d) => {
      renderDetailPanel(event, d, mode, filteredFlights);
      renderForSelection();
    });

  if (todayRowIndex >= 0 && currentHour >= 0 && currentHour <= 23) {
    const x = margin.left + currentHour * (cellSize + gap);
    const y = margin.top + todayRowIndex * (cellSize + gap);
    g.append("rect")
      .attr("x", x - 2)
      .attr("y", y - 2)
      .attr("width", cellSize + 4)
      .attr("height", cellSize + 4)
      .attr("rx", 5)
      .attr("fill", "none")
      .attr("stroke", "#60a5fa")
      .attr("stroke-width", 1.2)
      .attr("opacity", 0.85);
  }

  g.selectAll(".heatmap-total-bg")
    .data(dateKeys)
    .join("rect")
    .attr("class", "heatmap-total-bg")
    .attr("x", totalColX)
    .attr("y", (d) => margin.top + rowIndexByKey.get(d) * (cellSize + gap))
    .attr("width", totalColumnWidth)
    .attr("height", cellSize)
    .attr("rx", 4)
    .attr("ry", 4)
    .attr("fill", "#eef2ff")
    .attr("stroke", "#cbd5e1")
    .attr("stroke-width", 0.8);

  g.selectAll(".heatmap-total-value")
    .data(dateKeys)
    .join("text")
    .attr("class", "heatmap-axis-label heatmap-total-value")
    .attr("x", totalColX + totalColumnWidth / 2)
    .attr("y", (d) => margin.top + rowIndexByKey.get(d) * (cellSize + gap) + cellSize / 2 + 4)
    .attr("text-anchor", "middle")
    .style("font-weight", "700")
    .style("font-size", "0.88rem")
    .text((d) => totalsByDate.get(d) ?? 0);
}

function renderAdvisory(box, label, heatmapData) {
  const direction = label.toLowerCase().startsWith("departure") ? "departures" : "arrivals";
  const now = new Date();
  const nowDateKey = torontoDateKey(now);
  const nowHour = torontoHour(now);
  const hourMs = 60 * 60 * 1000;
  const windowStartTs = parseDateKey(nowDateKey).getTime() + nowHour * hourMs;
  const windowEndTs = windowStartTs + 4 * hourMs;

  const lookAheadCells = heatmapData.cells
    .map((c) => ({
      ...c,
      ts: parseDateKey(c.dateKey).getTime() + c.hour * hourMs
    }))
    .filter((c) => c.ts >= windowStartTs && c.ts < windowEndTs)
    .sort((a, b) => a.ts - b.ts);

  const maxCount = d3.max(lookAheadCells, (c) => c.total) || 0;
  const level = getDemandLevel(maxCount);
  const recommendation = getStaffingRecommendation(level);
  const impactLine = getDepartmentImpact(direction);
  const matchingCells = lookAheadCells.filter((c) => getDemandLevel(c.total) === level);
  const startHour = matchingCells.length ? matchingCells[0].hour : nowHour;
  const endHour = matchingCells.length ? matchingCells[matchingCells.length - 1].hour + 1 : nowHour + 1;
  const expectedRange = `${formatHourLabel(startHour)}–${formatHourLabel(endHour % 24)}`;

  let planningLine = "No significant demand spike expected";
  let prepLine = "Normal staffing is sufficient";

  if (level === "Peak") {
    planningLine = `Peak demand expected between ${expectedRange}`;
    prepLine = "Begin planning at least 4 hours in advance";
  } else if (level === "Busy") {
    planningLine = `Busy period expected between ${expectedRange}`;
    prepLine = "Prepare additional staffing support";
  } else if (level === "Moderate") {
    planningLine = "Steady activity expected";
    prepLine = "No immediate escalation required";
  }

  box.innerHTML = `
    <h4>${label} Advisory (${selectedFlightType === "domestic" ? "Domestic" : "International"})</h4>
    <div class="staff-insight-badge ${getDemandBadgeClass(level)}">${level}</div>
    <div>${recommendation}</div>
    <div class="advisory-subline">${planningLine}</div>
    <div class="advisory-subline">${prepLine}</div>
    <div class="advisory-subline">${impactLine}</div>`;
}

function renderSummaryCards(filteredFlights) {
  const todayKey = torontoDateKey(new Date());
  const flightsToday = filteredFlights.filter((f) => {
    const dt = toLocalDate(f.scheduledTime);
    return dt && torontoDateKey(dt) === todayKey;
  });

  const hourly = Array.from({ length: 24 }, () => 0);
  flightsToday.forEach((f) => {
    const dt = toLocalDate(f.scheduledTime);
    if (!dt) return;
    hourly[torontoHour(dt)] += 1;
  });

  const maxFlights = Math.max(...hourly);
  const peakHourIndex = hourly.indexOf(maxFlights);

  const hourMs = 60 * 60 * 1000;
  const now = new Date();
  const nowDateKey = torontoDateKey(now);
  const nowHour = torontoHour(now);
  const windowStartTs = parseDateKey(nowDateKey).getTime() + nowHour * hourMs;
  const upcomingModeHourCounts = new Map();

  filteredFlights.forEach((f) => {
    const dt = toLocalDate(f.scheduledTime);
    if (!dt) return;

    const dateKey = torontoDateKey(dt);
    const hour = torontoHour(dt);
    const slotTs = parseDateKey(dateKey).getTime() + hour * hourMs;
  if (slotTs < windowStartTs) return;

    if (isYYZDeparture(f)) {
      const key = `departure|${slotTs}`;
      if (!upcomingModeHourCounts.has(key)) {
        upcomingModeHourCounts.set(key, { mode: "departure", slotTs, hour, dateKey, count: 0 });
      }
      upcomingModeHourCounts.get(key).count += 1;
    }

    if (isYYZArrival(f)) {
      const key = `arrival|${slotTs}`;
      if (!upcomingModeHourCounts.has(key)) {
        upcomingModeHourCounts.set(key, { mode: "arrival", slotTs, hour, dateKey, count: 0 });
      }
      upcomingModeHourCounts.get(key).count += 1;
    }
  });

  const upcomingSlots = Array.from(upcomingModeHourCounts.values());
  const upcomingPeakCount = d3.max(upcomingSlots, (d) => d.count) || 0;
  const upcomingPeakSlot = upcomingSlots
    .filter((d) => d.count === upcomingPeakCount)
    .sort((a, b) => {
    if (a.slotTs !== b.slotTs) return a.slotTs - b.slotTs;
    if (a.mode === b.mode) return 0;
    return a.mode === "departure" ? -1 : 1;
    })[0];

  const dayPrefix = upcomingPeakSlot
    ? (upcomingPeakSlot.dateKey === nowDateKey ? "Today" : "Next")
    : "";

  const peakHourLabel = upcomingPeakSlot
    ? `${upcomingPeakSlot.mode === "departure" ? "Departure" : "Arrival"}: ${formatHourLabel(upcomingPeakSlot.hour)}–${formatHourLabel((upcomingPeakSlot.hour + 1) % 24)} <span class="metric-inline-note">(${dayPrefix}, ${upcomingPeakSlot.count} flights)</span>`
    : `<span class="metric-inline-note">No upcoming Departure/Arrival peak found</span>`;

  const arrivals = flightsToday.filter((f) => isYYZArrival(f)).length;
  const departures = flightsToday.filter((f) => isYYZDeparture(f)).length;

  const DELAY_THRESHOLD = 15;

  const delayedCount = flightsToday.filter((f) => getDelayMinutes(f) > DELAY_THRESHOLD).length;

  const threshold = maxFlights * 0.9;
  const peakHours = maxFlights > 0
    ? hourly
        .map((v, i) => ({ v, i }))
        .filter((d) => d.v >= threshold)
        .map((d) => d.i)
    : [];

  const peakWindow = peakHours.length
    ? `${formatHourLabel(Math.min(...peakHours))}–${formatHourLabel((Math.max(...peakHours) + 1) % 24)}`
    : "—";

  const demandChange = maxFlights > 0
    ? maxFlights - hourly[peakHourIndex === 0 ? 23 : peakHourIndex - 1]
    : 0;

  const departuresToday = flightsToday.filter((f) => isYYZDeparture(f));
  const arrivalsToday = flightsToday.filter((f) => isYYZArrival(f));

  const shouldUseDestination = departuresToday.length >= arrivalsToday.length;
  const routeSource = shouldUseDestination ? departuresToday : arrivalsToday;
  const routeLabel = shouldUseDestination ? "Top Destination" : "Top Origin";
  const routeMap = new Map();
  routeSource.forEach((f) => {
    const key = f.otherAirport || f.otherAirportCode || "Unknown";
    if (!key) return;
    routeMap.set(key, (routeMap.get(key) || 0) + 1);
  });
  const [topRouteName, topRouteCount] = Array.from(routeMap.entries()).sort((a, b) => b[1] - a[1])[0] || ["Unknown", 0];

  const topAirline = aggregateAirlines(flightsToday)[0];
  const topAirlineName = topAirline?.[0] || "No dominant carrier";
  const topAirlineCount = topAirline?.[1] || 0;
  const topAirlineShare = flightsToday.length
    ? Math.round((topAirlineCount / flightsToday.length) * 100)
    : 0;

  const insights = [
    {
      id: "peak-window",
      label: "Peak Window",
      value: peakWindow,
      valueClass: "insights-value-peak"
    },
    {
      id: "peak-load",
      label: "Peak Load",
      value: `${maxFlights} flights (${formatHourLabel(peakHourIndex)})`,
      valueClass: "insights-value-peak"
    },
    {
      id: "delayed",
      label: "Delayed Flights",
      value: `${delayedCount}`,
      valueClass: "insights-value-delayed"
    },
    {
      id: "demand-change",
      label: "Demand Change",
      value: `${demandChange >= 0 ? "+" : ""}${demandChange} vs last hour`,
      valueClass:
        demandChange > 0
          ? "insights-value-demand-up"
          : demandChange < 0
            ? "insights-value-demand-down"
            : "insights-value-demand-flat"
    },
    {
      id: "top-route",
      label: routeLabel,
      value: `${topRouteName} (${topRouteCount} flights)`,
      valueClass: "insights-value-route"
    },
    {
      id: "carrier",
      label: "Top Carrier",
      value: `${topAirlineName} (${topAirlineShare}%)`,
      valueClass: "insights-value-carrier"
    }
  ];

  ui.metrics.total.set(String(flightsToday.length));
  ui.metrics.peak.setHtml(peakHourLabel);
  ui.metrics.split.set(`${arrivals} : ${departures}`);
  ui.insightsCarousel.setInsights(insights);
}

function updateDateFilterOptions(selectEl, flights) {

  const sorted = Array.from(labelByDateKey.entries()).sort((a, b) => a[0].localeCompare(b[0]));

    const opt = document.createElement("option");
    opt.value = label;
    opt.textContent = label;
    selectEl.appendChild(opt);
  });

  const nextValue = Array.from(selectEl.options).some((o) => o.value === selected) ? selected : "all";
  selectEl.value = nextValue;

function renderFlightLists(filteredFlights) {
  const departures = filteredFlights.filter((f) => isYYZDeparture(f));
  const arrivals = filteredFlights.filter((f) => isYYZArrival(f));

  updateDateFilterOptions(ui.depListDateFilter, departures);
  updateDateFilterOptions(ui.arrListDateFilter, arrivals);

  const filteredDepartures = filterFlightsByDateAndTime(

    ui.depListDateFilter.value,
    ui.depListTimeFilter.value

  const filteredArrivals = filterFlightsByDateAndTime(
    arrivals,
    ui.arrListDateFilter.value,
    ui.arrListTimeFilter.value

function renderForSelection() {
  const filteredFlights = getFilteredFlights();

  arrHeatmapCache = buildDirectionalHeatmapData(filteredFlights, dateKeys, "arrivals");

  const sharedMax = Math.max(depHeatmapCache.maxTotal, arrHeatmapCache.maxTotal, 1);
  currentHeatmapBands = buildHeatmapBands(sharedMax);
  updateHeatmapLegendFromBands(ui.heatmapLegend, currentHeatmapBands);

};

ui.depListDateFilter.addEventListener("change", handleListFilterChange);
ui.depListTimeFilter.addEventListener("change", handleListFilterChange);
ui.arrListDateFilter.addEventListener("change", handleListFilterChange);
ui.arrListTimeFilter.addEventListener("change", handleListFilterChange);

function applyNewData(srcData) {
  allFlights = (srcData?.flights ?? []).map(normalizeFlightRecord);
  loadedDates = srcData?.dates || loadedDates;
  fetchedAt = srcData?.fetchedAt ? new Date(srcData.fetchedAt) : fetchedAt;

  ui.lastUpdatedEl.textContent = fetchedAt

        timeZone: "America/Toronto",
        dateStyle: "medium",
        timeStyle: "short"
      })} ET`
    : "Last updated: —";
  renderForSelection();
}

async function fetchLatestFlightsData() {
  const attachmentUrl = await FileAttachment("./data/flights.json").url();
  const primaryUrl = `${attachmentUrl}${attachmentUrl.includes("?") ? "&" : "?"}_=${Date.now()}`;
  const resp = await fetch(primaryUrl, { cache: "no-store" });
  if (resp.ok) return await resp.json();

  // Fallback for environments where attachment URLs are restricted.
  const fallbackResp = await fetch(`./data/flights.json?_=${Date.now()}`, { cache: "no-store" });
  if (!fallbackResp.ok) return null;
  return await fallbackResp.json();
}

      incoming.fetchedAt !== lastFetchedAtIso ||
      (incoming?.flights?.length ?? 0) !== allFlights.length;
