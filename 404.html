function toLocalDate(iso) {
  if (!iso) return null;
  const dt = new Date(iso);
  return Number.isNaN(dt.getTime()) ? null : dt;
}

function torontoDateKey(date) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Toronto",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);
  const year = parts.find((p) => p.type === "year")?.value;
  const month = parts.find((p) => p.type === "month")?.value;
  const day = parts.find((p) => p.type === "day")?.value;
  return `${year}-${month}-${day}`;
}

function torontoHour(date) {
  return Number(
    date.toLocaleString("en-CA", {
      timeZone: "America/Toronto",
      hour12: false,
      hour: "2-digit"
    })
  );
}

function parseDateKey(dateKey) {
  const [y, m, d] = dateKey.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d, 0, 0, 0));
}

function shiftDateKey(dateKey, offsetDays) {
  const dt = parseDateKey(dateKey);
  dt.setUTCDate(dt.getUTCDate() + offsetDays);
  const y = dt.getUTCFullYear();
  const m = String(dt.getUTCMonth() + 1).padStart(2, "0");
  const d = String(dt.getUTCDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function formatTimeEt(iso) {
  if (!iso) return "—";
  const dt = new Date(iso);
  if (Number.isNaN(dt.getTime())) return "—";
  return dt.toLocaleString("en-CA", {
    timeZone: "America/Toronto",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
}

function formatHourLabel(hour) {
  return `${String(hour).padStart(2, "0")}:00`;
}

function inferCountryFromIata(iata) {
  const code = (iata || "").toUpperCase();
  if (code === "YYZ") return "CA";
  if (/^Y[A-Z0-9]{2}$/.test(code)) return "CA";
  return null;
}

function getAirlineName(flight) {
  if (!flight) return "Unknown";
  if (typeof flight.airline === "string") return flight.airline;
  return flight.airline?.name || flight.flightNumber || "Unknown";
}

function normalizeFlightRecord(flight) {
  const departureIata =
    flight?.departure?.airport?.iata ||
    flight?.departureIata ||
    (flight?.type === "arrival" ? flight?.otherAirportCode : "YYZ") ||
    "";

  const arrivalIata =
    flight?.arrival?.airport?.iata ||
    flight?.arrivalIata ||
    (flight?.type === "departure" ? flight?.otherAirportCode : "YYZ") ||
    "";

  const depCountry =
    flight?.departure?.airport?.countryCode ||
    flight?.departureCountryCode ||
    inferCountryFromIata(departureIata);
  const arrCountry =
    flight?.arrival?.airport?.countryCode ||
    flight?.arrivalCountryCode ||
    inferCountryFromIata(arrivalIata);
  const airlineName = getAirlineName(flight);

  return {
    ...flight,
    airline: { name: airlineName },
    airlineName,
    departure: {
      airport: {
        iata: departureIata,
        countryCode: depCountry || null
      }
    },
    arrival: {
      airport: {
        iata: arrivalIata,
        countryCode: arrCountry || null
      }
    }
  };
}

function filterFlightsByType(flights, type) {
  const normalizeCountryCode = (code) => {
    if (!code || typeof code !== "string") return null;
    const normalized = code.trim().toUpperCase();
    return normalized || null;
  };

  if (type === "domestic") {
    return flights.filter((flight) => {
      const dep = normalizeCountryCode(flight.departure?.airport?.countryCode);
      const arr = normalizeCountryCode(flight.arrival?.airport?.countryCode);
      return dep && arr && dep === arr;
    });
  }

  if (type === "international") {
    return flights.filter((flight) => {
      const dep = normalizeCountryCode(flight.departure?.airport?.countryCode);
      const arr = normalizeCountryCode(flight.arrival?.airport?.countryCode);
      return dep && arr && dep !== arr;
    });
  }

  return flights;
}

function aggregateAirlines(flights) {
  const map = new Map();

  flights.forEach(flight => {
    const name = flight.airline?.name;
    if (!name) return;

    map.set(name, (map.get(name) || 0) + 1);
  });

  return Array.from(map.entries())
    .sort((a, b) => b[1] - a[1]);
}

function isYYZDeparture(f) {
  return (f.departureIata || "").toUpperCase() === "YYZ" || f.type === "departure";
}

function isYYZArrival(f) {
  return (f.arrivalIata || "").toUpperCase() === "YYZ" || f.type === "arrival";
}

function getHeatmapDateKeys(loadedDates) {
  const loaded = [loadedDates?.yesterday, loadedDates?.today, loadedDates?.tomorrow].filter(
    (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)
  );
  if (loaded.length === 3) return loaded;
  const todayKey = torontoDateKey(new Date());
  return [shiftDateKey(todayKey, -1), todayKey, shiftDateKey(todayKey, 1)];
}

function buildDirectionalHeatmapData(flights, dateKeys, mode) {
  const effectiveDateKeys = [...dateKeys];
  const byDateHour = new Map();

  flights.forEach((f) => {
    if (mode === "departures" && !isYYZDeparture(f)) return;
    if (mode === "arrivals" && !isYYZArrival(f)) return;

    const when = toLocalDate(f.scheduledTime);
    if (!when) return;

    const dateKey = torontoDateKey(when);
    if (!effectiveDateKeys.includes(dateKey)) return;

    const hour = torontoHour(when);
    if (hour < 0 || hour > 23) return;

    const mapKey = `${dateKey}|${hour}`;
    if (!byDateHour.has(mapKey)) {
      byDateHour.set(mapKey, {
        dateKey,
        hour,
        total: 0,
        airlines: new Set()
      });
    }

    const slot = byDateHour.get(mapKey);
    slot.total += 1;
    slot.airlines.add(getAirlineName(f));
  });

  const cells = [];
  effectiveDateKeys.forEach((dateKey) => {
    for (let hour = 0; hour < 24; hour++) {
      const slot = byDateHour.get(`${dateKey}|${hour}`);
      cells.push(slot ?? { dateKey, hour, total: 0, airlines: new Set() });
    }
  });

  const maxTotal = d3.max(cells, (d) => d.total) || 0;
  return { dateKeys: effectiveDateKeys, cells, maxTotal };
}

function buildHeatmapBands(peakMax) {
  const peak = Math.max(1, Number(peakMax) || 1);
  let q1 = Math.ceil(peak * 0.25);
  let q2 = Math.ceil(peak * 0.5);
  let q3 = Math.ceil(peak * 0.75);
  q1 = Math.max(1, q1);
  q2 = Math.max(q1 + 1, q2);
  q3 = Math.max(q2 + 1, q3);
  return {
    domain: [1, q1 + 1, q2 + 1, q3 + 1],
    lowMax: q1,
    moderateMin: q1 + 1,
    moderateMax: q2,
    busyMin: q2 + 1,
    busyMax: q3,
    peakMin: q3 + 1
  };
}

let currentHeatmapBands = buildHeatmapBands(81);

}

}

function getFlightsForCell(flights, mode, dateKey, hour) {
  return flights.filter((f) => {
    if (mode === "departures" && !isYYZDeparture(f)) return false;
    if (mode === "arrivals" && !isYYZArrival(f)) return false;
    const dt = toLocalDate(f.scheduledTime);
    if (!dt) return false;
    return torontoDateKey(dt) === dateKey && torontoHour(dt) === hour;
  });
}

    <div class="detail-delta">${deltaText} vs previous hour</div>
    <div><strong>Airlines Operating</strong></div>
    ${airlineGrid}`;

  const closeBtn = ui.detailPanel.querySelector(".detail-panel-close");
  if (closeBtn) {
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      selectedCell = null;
      ui.detailPanel.classList.add("hidden");
      renderForSelection();
    });
  }

  const cardRect = ui.heatmapCard.getBoundingClientRect();
  const x = Math.min(Math.max(event.clientX - cardRect.left + 12, 12), cardRect.width - 290);
  const y = Math.min(Math.max(event.clientY - cardRect.top + 12, 12), cardRect.height - 220);

  ui.detailPanel.style.left = `${x}px`;
  ui.detailPanel.style.top = `${y}px`;
  ui.detailPanel.classList.remove("hidden");
}

function drawDirectionalHeatmap(svg, container, heatmapData, mode, filteredFlights) {
  const { dateKeys, cells } = heatmapData;
  svg.selectAll("*").remove();

  const margin = { top: 28, right: 122, bottom: 14, left: 112 };
  const cols = 24;
  const gap = 3;

  const baseWidth = container.clientWidth || 1000;
  const usableWidth = Math.max(360, baseWidth - margin.left - margin.right);
  const cellSize = Math.max(16, Math.floor((usableWidth - gap * (cols - 1)) / cols));
  const gridWidth = cols * cellSize + (cols - 1) * gap;
  const rows = dateKeys.length;
  const gridHeight = rows * cellSize + (rows - 1) * gap;

  const width = margin.left + gridWidth + margin.right;
  const height = margin.top + gridHeight + margin.bottom;

  svg
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("preserveAspectRatio", "xMinYMin meet")
    .attr("width", "100%")
    .attr("height", height);

  const g = svg.append("g");
  const todayKey = torontoDateKey(new Date());
  const currentHour = torontoHour(new Date());
  const todayRowIndex = dateKeys.indexOf(todayKey);

  const rowIndexByKey = new Map(dateKeys.map((d, i) => [d, i]));
  const totalColumnGap = 20;
  const totalColumnWidth = Math.max(cellSize + 10, Math.round(cellSize * 1.25));
  const totalsByDate = new Map(
    dateKeys.map((dateKey) => [
      dateKey,
      d3.sum(cells.filter((c) => c.dateKey === dateKey), (c) => c.total)
    ])
  );
  const totalColX = margin.left + gridWidth + totalColumnGap;

  g.selectAll(".heatmap-hour-label")
    .data(d3.range(24))
    .join("text")
    .attr("class", "heatmap-axis-label heatmap-hour-label")
    .attr("x", (d) => margin.left + d * (cellSize + gap) + cellSize / 2)
    .attr("y", margin.top - 8)
    .attr("text-anchor", "middle")
    .text((d) => String(d).padStart(2, "0"));

  g.append("text")
    .attr("class", "heatmap-axis-label heatmap-total-label")
    .attr("x", totalColX + totalColumnWidth / 2)
    .attr("y", margin.top - 8)
    .attr("text-anchor", "middle")
    .style("font-weight", "700")
    .text("Total");

  g.selectAll(".heatmap-date-label")
    .data(dateKeys)
    .join("text")
    .attr("class", "heatmap-axis-label heatmap-date-label")
    .attr("x", margin.left - 10)
    .attr("y", (_, i) => margin.top + i * (cellSize + gap) + cellSize / 2 + 4)
    .attr("text-anchor", "end")
    .style("font-weight", (d) => (d === todayKey ? "700" : "400"))
    .text((d) =>
      parseDateKey(d).toLocaleDateString("en-CA", {
        timeZone: "UTC",
        weekday: "short",
        month: "short",
        day: "numeric"
      })
    );

  g.selectAll(".heatmap-cell")
    .data(cells)
    .join("rect")
    .attr("class", (d) => {
      const selected =
        selectedCell &&
        selectedCell.mode === mode &&
        selectedCell.dateKey === d.dateKey &&
        selectedCell.hour === d.hour;
      return `heatmap-cell${selected ? " heatmap-cell-selected" : ""}`;
    })
    .attr("x", (d) => margin.left + d.hour * (cellSize + gap))
    .attr("y", (d) => margin.top + rowIndexByKey.get(d.dateKey) * (cellSize + gap))
    .attr("width", cellSize)
    .attr("height", cellSize)
    .attr("rx", 4)
    .attr("ry", 4)
    .attr("fill", (d) => heatmapColor(d.total))
    .style("cursor", "pointer")
    .on("click", (event, d) => {
      renderDetailPanel(event, d, mode, filteredFlights);
      renderForSelection();
    });

  if (todayRowIndex >= 0 && currentHour >= 0 && currentHour <= 23) {
    const x = margin.left + currentHour * (cellSize + gap);
    const y = margin.top + todayRowIndex * (cellSize + gap);
    g.append("rect")
      .attr("class", "current-hour-highlight-under")
      .attr("x", x - 3)
      .attr("y", y - 3)
      .attr("width", cellSize + 6)
      .attr("height", cellSize + 6)
      .attr("rx", 6);

    g.append("rect")
      .attr("class", "current-hour-highlight")
      .attr("x", x - 3)
      .attr("y", y - 3)
      .attr("width", cellSize + 6)
      .attr("height", cellSize + 6)
      .attr("rx", 6);
  }

  g.selectAll(".heatmap-total-bg")
    .data(dateKeys)
    .join("rect")
    .attr("class", "heatmap-total-bg")
    .attr("x", totalColX)
    .attr("y", (d) => margin.top + rowIndexByKey.get(d) * (cellSize + gap))
    .attr("width", totalColumnWidth)
    .attr("height", cellSize)
    .attr("rx", 4)
    .attr("ry", 4)
    .attr("fill", "#eef2ff")
    .attr("stroke", "#cbd5e1")
    .attr("stroke-width", 0.8);

  g.selectAll(".heatmap-total-value")
    .data(dateKeys)
    .join("text")
    .attr("class", "heatmap-axis-label heatmap-total-value")
    .attr("x", totalColX + totalColumnWidth / 2)
    .attr("y", (d) => margin.top + rowIndexByKey.get(d) * (cellSize + gap) + cellSize / 2 + 4)
    .attr("text-anchor", "middle")
    .style("font-weight", "700")
    .style("font-size", "0.88rem")
    .text((d) => totalsByDate.get(d) ?? 0);
}

function renderAdvisory(box, label, heatmapData) {
  const direction = label.toLowerCase().startsWith("departure") ? "departures" : "arrivals";
  const now = new Date();
  const nowDateKey = torontoDateKey(now);
  const nowHour = torontoHour(now);
  const hourMs = 60 * 60 * 1000;
  const windowStartTs = parseDateKey(nowDateKey).getTime() + nowHour * hourMs;
  const windowEndTs = windowStartTs + 4 * hourMs;

  const lookAheadCells = heatmapData.cells
    .map((c) => ({
      ...c,
      ts: parseDateKey(c.dateKey).getTime() + c.hour * hourMs
    }))
    .filter((c) => c.ts >= windowStartTs && c.ts < windowEndTs)
    .sort((a, b) => a.ts - b.ts);

  const maxCount = d3.max(lookAheadCells, (c) => c.total) || 0;
  const level = getDemandLevel(maxCount);
  const recommendation = getStaffingRecommendation(level);
  const impactLine = getDepartmentImpact(direction);
  const matchingCells = lookAheadCells.filter((c) => getDemandLevel(c.total) === level);
  const startHour = matchingCells.length ? matchingCells[0].hour : nowHour;
  const endHour = matchingCells.length ? matchingCells[matchingCells.length - 1].hour + 1 : nowHour + 1;
  const expectedRange = `${formatHourLabel(startHour)}–${formatHourLabel(endHour % 24)}`;

  let planningLine = "No significant demand spike expected";
  let prepLine = "Normal staffing is sufficient";

  if (level === "Peak") {
    planningLine = `Peak demand expected between ${expectedRange}`;
    prepLine = "Begin planning at least 4 hours in advance";
  } else if (level === "Busy") {
    planningLine = `Busy period expected between ${expectedRange}`;
    prepLine = "Review staffing coverage 4 hours ahead";
  } else if (level === "Moderate") {
    planningLine = "Steady activity expected";
    prepLine = "No immediate escalation required";
  }

  box.innerHTML = `
    <h4>${label} Advisory (${selectedFlightType === "domestic" ? "Domestic" : "International"})</h4>
    <div class="staff-insight-badge ${getDemandBadgeClass(level)}">${level}</div>
    <div>${recommendation}</div>
    <div class="advisory-subline">${planningLine}</div>
    <div class="advisory-subline">${prepLine}</div>
    <div class="advisory-subline">${impactLine}</div>`;
}

function renderSummaryCards(filteredFlights) {
  const todayKey = torontoDateKey(new Date());
  const flightsToday = filteredFlights.filter((f) => {
    const dt = toLocalDate(f.scheduledTime);
    return dt && torontoDateKey(dt) === todayKey;
  });

  const hourly = Array.from({ length: 24 }, () => 0);
  flightsToday.forEach((f) => {
    const dt = toLocalDate(f.scheduledTime);
    if (!dt) return;
    hourly[torontoHour(dt)] += 1;
  });

  const maxFlights = Math.max(...hourly);
  const peakHourIndex = hourly.indexOf(maxFlights);
  const threshold = maxFlights * 0.9;
  const peakHours = maxFlights > 0
    ? hourly
        .map((v, i) => ({ v, i }))
        .filter((d) => d.v >= threshold)
        .map((d) => d.i)
    : [];

  const peakHourLabel = maxFlights > 0
    ? `${formatHourLabel(peakHourIndex)}–${formatHourLabel((peakHourIndex + 1) % 24)} <span class="metric-inline-note">(${maxFlights} flights)</span>`
    : "—";

  const busiestPeriodLabel = peakHours.length
    ? `${formatHourLabel(Math.min(...peakHours))}–${formatHourLabel(Math.max(...peakHours) + 1)}`
    : "—";

  const arrivals = flightsToday.filter((f) => isYYZArrival(f)).length;
  const departures = flightsToday.filter((f) => isYYZDeparture(f)).length;

  ui.metrics.total.set(String(flightsToday.length));
  ui.metrics.peak.setHtml(peakHourLabel);
  ui.metrics.split.set(`${arrivals} : ${departures}`);
  ui.metrics.busiest.set(busiestPeriodLabel);
}

function renderFlightListTable(el, flights, typeBadge, locationHeader, emptyText) {
  el.innerHTML = "";

  if (fetchedAt) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `Last updated: ${fetchedAt.toLocaleString("en-CA", {
      timeZone: "America/Toronto",
      dateStyle: "medium",
      timeStyle: "short"
    })} ET · ${flights.length} flight${flights.length !== 1 ? "s" : ""}`;
    el.appendChild(meta);
  }

  if (!flights.length) {
    const empty = document.createElement("div");
    empty.className = "empty-box";
    empty.textContent = emptyText;
    el.appendChild(empty);
    return;
  }

  const rows = flights
    .sort((a, b) => new Date(a.scheduledTime) - new Date(b.scheduledTime))
    .slice(0, 120)
    .map((f) => {
      const airport = f.otherAirportCode ? `${f.otherAirport} (${f.otherAirportCode})` : f.otherAirport;
      return `
        <tr>
          <td><span class="badge badge-${typeBadge}">${typeBadge.toUpperCase()}</span></td>
          <td><strong>${f.flightNumber || "N/A"}</strong></td>
          <td>${getAirlineName(f)}</td>
          <td>${airport || "Unknown"}</td>
          <td>${formatTimeEt(f.scheduledTime)}</td>
        </tr>`;
    })
    .join("");

  const table = document.createElement("table");
  table.className = "flight-board";
  table.innerHTML = `
    <thead>
      <tr>
        <th>Type</th>
        <th>Flight</th>
        <th>Airline</th>
        <th>${locationHeader}</th>
        <th>Scheduled (ET)</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>`;
  el.appendChild(table);
}

function renderFlightLists(filteredFlights) {
  const departures = filteredFlights.filter((f) => isYYZDeparture(f));
  const arrivals = filteredFlights.filter((f) => isYYZArrival(f));
  renderFlightListTable(ui.depListBody, departures, "dep", "Destination", "No departure flights for this filter.");
  renderFlightListTable(ui.arrListBody, arrivals, "arr", "Origin", "No arrival flights for this filter.");
}

function renderForSelection() {
  const filteredFlights = getFilteredFlights();
  const dateKeys = getHeatmapDateKeys(loadedDates);
  depHeatmapCache = buildDirectionalHeatmapData(filteredFlights, dateKeys, "departures");
  arrHeatmapCache = buildDirectionalHeatmapData(filteredFlights, dateKeys, "arrivals");

  const sharedMax = Math.max(depHeatmapCache.maxTotal, arrHeatmapCache.maxTotal, 1);
  currentHeatmapBands = buildHeatmapBands(sharedMax);
  updateHeatmapLegendFromBands(ui.heatmapLegend, currentHeatmapBands);

  drawDirectionalHeatmap(ui.depHeatmapSvg, ui.depHeatmapContainer, depHeatmapCache, "departures", filteredFlights);
  drawDirectionalHeatmap(ui.arrHeatmapSvg, ui.arrHeatmapContainer, arrHeatmapCache, "arrivals", filteredFlights);

  renderSummaryCards(filteredFlights);
  renderAdvisory(ui.depAdvisory, "Departure", depHeatmapCache);
  renderAdvisory(ui.arrAdvisory, "Arrival", arrHeatmapCache);
  renderFlightLists(filteredFlights);
}

function updateToggleButtons() {
  ui.domesticBtn.classList.toggle("active", selectedFlightType === "domestic");
  ui.internationalBtn.classList.toggle("active", selectedFlightType === "international");
}

ui.domesticBtn.addEventListener("click", () => {
  selectedFlightType = "domestic";
  selectedCell = null;
  ui.detailPanel.classList.add("hidden");
  updateToggleButtons();
  renderForSelection();
});

ui.internationalBtn.addEventListener("click", () => {
  selectedFlightType = "international";
  selectedCell = null;
  ui.detailPanel.classList.add("hidden");
  updateToggleButtons();
  renderForSelection();
});

ui.scenarioSelect.addEventListener("change", (event) => {
  selectedScenario = event.target.value;
  renderHrSummary();
});

function applyNewData(srcData) {
  allFlights = (srcData?.flights ?? []).map(normalizeFlightRecord);
  loadedDates = srcData?.dates || loadedDates;
  fetchedAt = srcData?.fetchedAt ? new Date(srcData.fetchedAt) : fetchedAt;
  lastFetchedAtIso = srcData?.fetchedAt || lastFetchedAtIso;
  ui.lastUpdatedEl.textContent = fetchedAt
    ? `Last updated: ${fetchedAt.toLocaleString("en-CA", {
        timeZone: "America/Toronto",
        dateStyle: "medium",
        timeStyle: "short"
      })} ET`
    : "Last updated: —";
  renderForSelection();
}

async function fetchLatestFlightsData() {
  const stablePath = (() => {
    if (typeof window === "undefined") {
      return `./data/flights.json?_=${Date.now()}`;
    }
    let basePath = window.location.pathname || "/";
    if (basePath.endsWith("/")) {
      // already directory
    } else if (/\.[a-zA-Z0-9]+$/.test(basePath)) {
      basePath = basePath.replace(/[^/]+$/, "");
    } else {
      basePath = `${basePath}/`;
    }
    const normalizedBase = basePath.startsWith("/") ? basePath : `/${basePath}`;
    return `${window.location.origin}${normalizedBase}data/flights.json?_=${Date.now()}`;
  })();

  const resp = await fetch(stablePath, { cache: "no-store" });
  if (resp.ok) return await resp.json();
  const attachmentUrl = await FileAttachment("./data/flights.json").url();
  const fallbackResp = await fetch(`${attachmentUrl}${attachmentUrl.includes("?") ? "&" : "?"}_=${Date.now()}`, { cache: "no-store" });
  if (!fallbackResp.ok) return null;
  return await fallbackResp.json();
}

const REFRESH_MS = 60 * 60 * 1000;
const refreshTimer = setInterval(async () => {
  try {
    const incoming = await fetchLatestFlightsData();
    if (!incoming) return;
    const changed =
      !lastFetchedAtIso ||
      !incoming?.fetchedAt ||
      incoming.fetchedAt !== lastFetchedAtIso ||
      (incoming?.flights?.length ?? 0) !== allFlights.length;
    if (changed) {
      applyNewData(incoming);
    }
  } catch (err) {
    console.warn("Auto-refresh failed:", err);
  }
}, REFRESH_MS);

const clockTimer = setInterval(updateClock, 1000);
updateClock();
renderHrSummary();
applyNewData(data);

if (data.error) {
  const box = document.createElement("div");
  box.className = "error-box";
  box.innerHTML = `⚠️ Failed to load flight data: ${data.error}`;
  display(box);
}

if (typeof invalidation !== "undefined") {
  invalidation.then(() => {
    clearInterval(refreshTimer);
    clearInterval(clockTimer);
  });
}
return {d3,toLocalDate,torontoDateKey,torontoHour,parseDateKey,shiftDateKey,formatTimeEt,formatHourLabel,inferCountryFromIata,getAirlineName,normalizeFlightRecord,filterFlightsByType,aggregateAirlines,isYYZDeparture,isYYZArrival,getHeatmapDateKeys,buildDirectionalHeatmapData,buildHeatmapBands,currentHeatmapBands,heatmapColor,updateHeatmapLegendFromBands,getDemandLevel,getStaffingRecommendation,getDemandBadgeClass,getDepartmentImpact,createMetricCard,staffingScenarios,formatInt,getCoverageIndicatorClass,buildUI,ui,allFlights,lastFetchedAtIso,fetchedAt,loadedDates,selectedFlightType,selectedScenario,selectedCell,depHeatmapCache,arrHeatmapCache,renderHrSummary,updateClock,getFilteredFlights,getFlightsForCell,renderDetailPanel,drawDirectionalHeatmap,renderAdvisory,renderSummaryCards,renderFlightListTable,renderFlightLists,renderForSelection,updateToggleButtons,applyNewData,fetchLatestFlightsData,REFRESH_MS,refreshTimer,clockTimer};
}});

</script>
