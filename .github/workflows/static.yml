name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      allow_empty_snapshot:
        description: 'Allow deploy even if generated flight snapshot is empty'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm run clean || true
      - run: npm run build
        env:
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      - name: Validate generated flight snapshot
        run: |
          latest="$(ls -t dist/_file/data/flights*.json 2>/dev/null | head -n1 || true)"
          if [ -z "$latest" ] || [ ! -f "$latest" ]; then
            echo "::warning::No generated flights*.json found after build; will fall back to src/data/flights.json if available."
            echo "USE_FALLBACK_SNAPSHOT=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Using snapshot: $latest"
          set +e
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const data = JSON.parse(fs.readFileSync(p, "utf8"));
            const flights = Array.isArray(data.flights) ? data.flights : [];
            const warnings = Array.isArray(data.warnings) ? data.warnings : [];
            const error = typeof data.error === "string" ? data.error : "";
            console.log(`Snapshot flights=${flights.length} warnings=${warnings.length}`);
            if (error) console.log(`Snapshot error=${error}`);
            if (warnings.length) console.log(`Snapshot warnings=${warnings.join(" | ")}`);
            if (flights.length === 0) {
              const allowEmpty = String(process.env.ALLOW_EMPTY_SNAPSHOT || "false").toLowerCase() === "true";
              if (allowEmpty) {
                console.warn("::warning::Generated flight snapshot is empty, but ALLOW_EMPTY_SNAPSHOT=true so deploy will continue.");
              } else {
                const extra = error
                  ? ` Root cause from loader: ${error}`
                  : (warnings.length ? ` Warnings: ${warnings.join(" | ")}` : "");
                console.warn(`::warning::Generated flight snapshot is empty.${extra} Falling back to src/data/flights.json if available.`);
                process.exit(42);
              }
            }
          ' "$latest"
          code="$?"
          set -e
          if [ "$code" = "42" ]; then
            echo "USE_FALLBACK_SNAPSHOT=true" >> "$GITHUB_ENV"
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi
        env:
          ALLOW_EMPTY_SNAPSHOT: ${{ github.event.inputs.allow_empty_snapshot || 'false' }}
      - name: Prepare stable data path
        run: |
          mkdir -p dist/data
          latest="$(ls -t dist/_file/data/flights*.json 2>/dev/null | head -n1 || true)"
          site_data_url="https://voq-sheridan.github.io/p3-airport-ops-dashboard/data/flights.json"
          if [ "${USE_FALLBACK_SNAPSHOT:-false}" = "true" ]; then
            if curl -fsSL "$site_data_url" -o dist/data/flights.json; then
              echo '::warning::Using previously published data/flights.json fallback from GitHub Pages.'
              if [ -n "$latest" ] && [ -f "$latest" ]; then
                cp dist/data/flights.json "$latest"
              fi
            elif [ -f src/data/flights.json ]; then
              echo '::warning::Using src/data/flights.json as local fallback snapshot.'
              cp src/data/flights.json dist/data/flights.json
              if [ -n "$latest" ] && [ -f "$latest" ]; then
                cp src/data/flights.json "$latest"
              fi
            else
              echo '::warning::Could not fetch previous snapshot and local fallback file is missing.'
              printf '{"flights":[],"fetchedAt":"%s","totalDepartures":0,"totalArrivals":0,"warnings":["No generated snapshot and no fallback snapshot available"],"error":"No generated snapshot and no fallback snapshot available"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/data/flights.json
            fi
          elif [ -n "$latest" ] && [ -f "$latest" ]; then
            cp "$latest" dist/data/flights.json
          else
            echo '::warning::No generated flights*.json found; writing empty fallback data file.'
            printf '{"flights":[],"fetchedAt":"%s","totalDepartures":0,"totalArrivals":0,"warnings":["No generated snapshot found during deploy"],"error":"No generated snapshot found during deploy"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/data/flights.json
          fi
      - run: cp src/favicon.svg dist/favicon.svg
      - run: cp src/favicon.svg dist/favicon.ico
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true